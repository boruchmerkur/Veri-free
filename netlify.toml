[build]
  command = "pip install pillow && python3 selfhost_favicons.py && python3 feeds.py && python3 wire.py && python3 generate.py"
  publish = "site"

[build.environment]
  LILY_SITE = "verifiedfree"
  # Pin Python so the build image provisions it deterministically.
  # Without this, `python3`/`pip` can be missing and the whole build aborts,
  # leaving the previous (function-less) deploy live — which 404s /api/lily.
  PYTHON_VERSION = "3.11"

# v2 functions in netlify/functions are auto-detected and bundled by Netlify's
# own pipeline. Do NOT set node_bundler here — "esbuild" is the v1 setting and
# forcing it can reject these v2 (export default (req, context) => Response)
# functions for a "missing handler".
[functions]
  directory = "netlify/functions"

# NOTE: the edge function lily-edge is declared INLINE in
# netlify/edge-functions/lily-edge.js via `export const config = { path: '/*' }`.
# It is intentionally NOT declared here as well — a second [[edge_functions]]
# block would double-register it and can fail the deploy.

# NO /api/lily redirect here on purpose.
# lily-collect is a v2 function that already claims /api/lily via its inline
# `export const config = { path: '/api/lily' }`, so it is served AT /api/lily
# directly. A v2 function with a custom path is NOT exposed at the legacy
# /.netlify/functions/lily-collect URL — so a forced redirect pointing there
# rewrites every /api/lily request to a dead URL and returns 404. Removing it
# lets the function's own route handle /api/lily.

# Netlify Image CDN. Feed art is hotlinked from publishers at full resolution.
# Measured 2026-09-17: the homepage pulled 3.36 MB of it, and the largest
# single file was a 1,015 KB JPEG rendered into a card a few hundred pixels
# wide. Routing those through /.netlify/images resizes and re-encodes at the
# edge, serves them same-origin, and caches them.
#
# This is an ALLOWLIST on purpose. A permissive pattern would make the site an
# open image proxy that anyone could run bandwidth through on this account.
# A host that is not listed falls back to its original URL, which is exactly
# today's behaviour — so a new publisher degrades rather than breaks.
#
# Patterns are TOML LITERAL strings (single quotes). Basic "..." strings treat
# backslash as an escape and silently corrupt every \. in a regex.
[images]
  remote_images = [
    # video thumbnails
    'https://i\d?\.ytimg\.com/.*',
    # Valnet network — XDA, Android Police, MakeUseOf, How-To Geek
    'https://static\d*\.[a-z]+images\.com/.*',
    'https://www\.xda-developers\.com/.*',
    'https://www\.androidpolice\.com/.*',
    'https://www\.makeuseof\.com/.*',
    'https://www\.howtogeek\.com/.*',
    # Future plc
    'https://cdn\.mos\.cms\.futurecdn\.net/.*',
    # tech press
    'https://www\.pcworld\.com/.*',
    'https://cdn\.arstechnica\.net/.*',
    'https://cdn\.vox-cdn\.com/.*',
    'https://techcrunch\.com/.*',
    'https://s\.yimg\.com/.*',
    'https://regmedia\.co\.uk/.*',
    # androidauthority returns 403 to the Image CDN's fetcher (checked
    # 2026-09-17), so it is deliberately not listed and serves direct.
    'https://9to5google\.com/.*',
    'https://lifehacker\.com/.*',
    'https://www\.eff\.org/.*',
    'https://krebsonsecurity\.com/.*',
    # money and crypto
    'https://images\.mktw\.net/.*',
    'https://s3-images\.ctmedia\.io/.*',
    'https://image\.cnbcfm\.com/.*',
    'https://i\.insider\.com/.*',
    'https://cdn\.sanity\.io/.*',
    'https://s3\.cointelegraph\.com/.*',
    'https://cdn\.decrypt\.co/.*',
    'https://www\.tbstat\.com/.*',
    'https://images\.fastcompany\.com/.*',
    'https://assets\.fastcompany\.com/.*',
    'https://www\.entrepreneur\.com/.*',
    'https://millennialmoney\.com/.*',
    'https://www\.gobankingrates\.com/.*',
    'https://www\.biggerpockets\.com/.*',
    'https://www\.smartpassiveincome\.com/.*',
    'https://www\.financialsamurai\.com/.*',
    'https://money\.com/.*',
    'https://www\.nerdwallet\.com/.*',
  ]
